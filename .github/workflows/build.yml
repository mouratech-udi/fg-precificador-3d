name: Verificar Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar dependências fixadas
        run: dotnet restore src/FG.Precificador/FG.Precificador.csproj --locked-mode
      - name: Compilar
        run: dotnet build src/FG.Precificador/FG.Precificador.csproj -c Release --no-restore
      - name: Executar autoteste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet src/FG.Precificador/bin/Release/net10.0-windows/win-x64/FG.Precificador.dll --self-test artifacts/autoteste.json
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/autoteste.json; throw 'Falha no autoteste.' }
          $result = Get-Content artifacts/autoteste.json -Raw | ConvertFrom-Json
          if (-not $result.success) { throw 'Autoteste reprovado.' }
      - name: Salvar resultado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resultado-autoteste-windows
          path: artifacts/autoteste.json
          if-no-files-found: warn
  motor-independente:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_ROLL_FORWARD: Major
      FG_REQUIRE_NO_BAMBU: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Compilar integração
        shell: pwsh
        run: |
          dotnet restore src/FG.Precificador/FG.Precificador.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Falha no restore.' }
          dotnet build src/FG.Precificador/FG.Precificador.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Falha na compilação.' }
      - name: Obter ferramenta de extração
        run: dotnet tool install wix --version 4.0.6 --tool-path .tools
      - name: Preparar motor sem instalar o Bambu Studio
        shell: pwsh
        run: |
          ./scripts/Preparar-Motor.ps1 -Destino src/FG.Precificador/bin/Release/net10.0-windows/win-x64/Engine -Wix "$PWD/.tools/wix.exe"
      - name: Fatiar projeto com motor integrado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet src/FG.Precificador/bin/Release/net10.0-windows/win-x64/FG.Precificador.dll --self-test-engine tests/fixtures/cubo-a1.3mf artifacts/motor-independente.json
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/motor-independente.json; throw 'Falha no motor integrado.' }
      - name: Salvar verificação do motor
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: motor-sem-bambu-instalado
          path: artifacts/motor-independente.json
          if-no-files-found: warn
